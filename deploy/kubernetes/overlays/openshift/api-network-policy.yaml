# Only the OpenShift router reaches the API, so a client address in X-Forwarded-For can only
# come from it (failed sign-ins are counted per address). The label is the one OpenShift puts
# on the router's namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: 8000
