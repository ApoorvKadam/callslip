# One host: /api goes to the API, everything else to the static frontend. Event streams need
# buffering off and a read timeout longer than a run.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: callslip
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {name: http}
