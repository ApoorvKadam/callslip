# Static files from an unprivileged nginx on port 8080. In the cluster, /api is routed to the
# api Service by the Ingress or Route, not proxied by this nginx.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: callslip-frontend
          ports:
            - name: http
              containerPort: 8080
          # When a rollout stops this pod, keep serving for 5 s while the ingress controller drops
          # it from its endpoints. Without the pause, requests in that gap failed with 502.
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
