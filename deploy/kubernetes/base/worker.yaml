# Ingestion workers claim jobs with FOR UPDATE SKIP LOCKED and a lease, so replicas can be
# raised without two workers taking the same document.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's app user; OpenShift assigns its own (overlay)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: callslip-backend
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: callslip-settings
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: callslip-secrets, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          # The worker touches this file on every loop; stale for 60 s means it is stuck.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat) )) -lt 60
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
