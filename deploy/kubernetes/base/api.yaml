# The API queues questions for the run workers and keeps no run state of its own, so it runs as
# several replicas and rolls out one pod at a time.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's app user; OpenShift assigns its own (overlay)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: callslip-backend
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: callslip-settings
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: callslip-secrets, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: callslip-secrets, key: ANTHROPIC_API_KEY}
            # The ingress or router reaches the API directly. Trust X-Forwarded-For only from
            # the cluster's own network, where the ingress runs; set this to that network.
            - name: FORWARDED_ALLOW_IPS
              value: "10.0.0.0/8"
          # Ready means the database answers; a missing Redis only degrades (200, "degraded").
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
            failureThreshold: 4
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
