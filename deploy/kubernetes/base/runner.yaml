# Run workers execute the questions the API queues. They claim runs with FOR UPDATE SKIP LOCKED
# and a renewed lease, so replicas never take the same run, and a run whose worker died is closed
# by the others.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's app user; OpenShift assigns its own (overlay)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: callslip-backend
          command: ["python", "-m", "app.runner"]
          envFrom:
            - configMapRef:
                name: callslip-settings
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: callslip-secrets, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: callslip-secrets, key: ANTHROPIC_API_KEY}
          # Touched every 10 s while the run worker loops; stale for 60 s means it is stuck.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/runner-heartbeat) )) -lt 60
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
