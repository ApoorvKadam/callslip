# The whole stack: `docker compose up -d --build`, then open http://localhost:8080
# Secrets and settings come from .env (copy .env.example); nothing secret is in this file.
name: agentic-rag

x-backend: &backend
  build: ./backend
  image: agentic-rag-backend:${IMAGE_TAG:-dev}
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rag}
    REDIS_URL: redis://redis:6379/0
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # Redis is a cache only: the app keeps working when it is down, so it needs no persistence.
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 768m

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      # The worker touches this file on every loop; stale for 60 s means it is stuck.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    mem_limit: 1g

  frontend:
    build: ./frontend
    image: agentic-rag-frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 64m

volumes:
  pgdata:
