[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG over PDFs with page-level citations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.3.0",
    "fastapi==0.162.0",
    "fastembed==0.9.1",
    "numpy>=2.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pypdf==6.21.3",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2==2.8.9",
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio>=1.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
