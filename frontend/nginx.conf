server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads go through this proxy; the API enforces its own 25 MB limit.
    client_max_body_size 30m;

    # Docker's DNS, re-resolved every 10 s: a recreated api container gets a new IP, and a
    # name resolved only at startup would keep pointing at the old one (502s until restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;


    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The client this proxy sees, replacing any header the client sent: the API counts
        # failed sign-ins per address and trusts this header from here only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events: pass each event through as soon as it is written.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # A stopped API answers 502 within seconds instead of leaving the page waiting.
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
