name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ragtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ragtest"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/ragtest
      TEST_REDIS_URL: redis://localhost:6379/0
      FASTEMBED_CACHE_PATH: /home/runner/fastembed-models
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.7.22"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/fastembed-models
          key: fastembed-bge-small-en-v1.5
      - name: Download the embedding model (first run only)
        run: >-
          uv run python -c "from fastembed import TextEmbedding;
          TextEmbedding('BAAI/bge-small-en-v1.5', cache_dir='$FASTEMBED_CACHE_PATH')"
      - name: Lint
        run: uv run ruff check . ../scripts
      - name: Format
        run: uv run ruff format --check . ../scripts
      - name: Tests (real PostgreSQL, Redis and embedding model; no LLM calls)
        run: uv run pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  stack:
    name: Compose build and smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure environment (no API key in CI)
        run: printf 'POSTGRES_PASSWORD=ci-%s\n' "${{ github.run_id }}" > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 240
      - name: Smoke test (health, readiness, upload, ingestion, search)
        env:
          SMOKE_PASSWORD: ci-smoke-${{ github.run_id }}
        run: python3 scripts/smoke_test.py
      - name: Sign in as the smoke-test account, which owns the test document
        env:
          SMOKE_PASSWORD: ci-smoke-${{ github.run_id }}
        run: |
          curl -sf -c jar.txt -H 'Content-Type: application/json' localhost:8080/api/auth/login \
            -d "{\"email\": \"smoke-test@callslip.invalid\", \"password\": \"$SMOKE_PASSWORD\"}"
      - name: Data survives a full restart
        run: |
          count() { curl -sf -b jar.txt localhost:8080/api/documents | python3 -c "import json,sys; print(len(json.load(sys.stdin)))"; }
          before=$(count)
          docker compose down
          docker compose up -d --wait --wait-timeout 240
          after=$(count)
          echo "documents before: $before, after: $after"
          test "$before" -gt 0 && test "$before" = "$after"
      - name: Redis outage degrades but search keeps working
        run: |
          docker compose stop redis
          curl -s localhost:8080/api/ready | tee ready.json
          grep -q '"status":"degraded"' ready.json
          curl -sf -b jar.txt -X POST localhost:8080/api/search -H 'Content-Type: application/json' \
            -d '{"query": "smoke test document"}' | python3 -c \
            "import json,sys; r=json.load(sys.stdin); print('hits', len(r['hits']), 'cache', r['cache']); assert r['hits'] and r['cache']=='unavailable'"
          docker compose start redis
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v

  kubernetes:
    name: Kubernetes manifests render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the overlays
        run: |
          kubectl kustomize deploy/kubernetes/overlays/ingress > ingress.yaml
          kubectl kustomize deploy/kubernetes/overlays/openshift > openshift.yaml
          kubectl kustomize deploy/kubernetes/overlays/kind > kind.yaml
      - name: Validate against the Kubernetes and OpenShift schemas
        run: >-
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/openshift/v4.15-strict/{{.ResourceKind}}_{{.Group}}_{{.ResourceAPIVersion}}.json'
          ingress.yaml openshift.yaml kind.yaml
      - name: Terraform format and validate
        run: |
          tf="docker run --rm -v $PWD:/w -w /w/deploy/terraform hashicorp/terraform:1.17.1"
          $tf fmt -check -diff
          $tf init -backend=false -input=false
          $tf validate
